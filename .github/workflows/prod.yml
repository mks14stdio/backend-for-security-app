name: Deploy in prod
on:
  push:
    branches:
      - "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-swag:prod-${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Copy files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: github
          key: ${{ secrets.SERVER_SSHKEY }}
          source: "./.env,docker-compose.yml"
          target: "~/prod"
      - name: Deploy in server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: github
          key: ${{ secrets.SERVER_SSHKEY }}
          script: |
            cd ~/prod
            export ENV_TYPE="production"
            export DB_PASSWORD="${{ secrets.PROD_POSTGRESS_PASSWORD }}"
            export ADMIN_PASSWORD="${{ secrets.PROD_ADMIN_PASSWORD }}"
            export ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}"
            export BACKEND_PORT=8000
            export JWT_PRIVATE="${{ secrets.PROD_JWT_KEYPRIVATE }}"
            export JWT_PUBLIC="${{ secrets.PROD_JWT_KEYPUBLIC }}"
            export BACKEND_TAG=prod-${{ github.sha }}
            export BACKEND_REPO="${{ secrets.DOCKER_USERNAME }}"

            docker compose -p prod down && docker compose -p prod pull && docker compose -p prod up -d --remove-orphans
