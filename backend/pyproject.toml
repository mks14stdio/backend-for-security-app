[tool.poetry]
name = "swag-backend"
version = "0.1.0"
description = ""
authors = ["Denis Sova <dsova@sfedu.ru>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.121.1"
uvicorn = "^0.38.0"
pydantic-settings = "^2.11.0"
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
pydantic = {extras = ["email"], version = "^2.12.4"}
httpx = "^0.28.1"
bcrypt = "^5.0.0"
sqlalchemy = "^2.0.44"
asyncpg = "^0.30.0"
alembic = "^1.17.1"
python-multipart = "^0.0.20"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.2.0"
aiosqlite = "^0.21.0"
pytest-cov = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
