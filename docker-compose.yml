services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: "${DB_USER?Var not Set}"
      POSTGRES_PASSWORD: "${DB_PASSWORD?Var not set}"
      POSTGRES_DB: "${DB_NAME?Var not Set}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    networks:
      - app-network

  prestart:
    image: ${BACKEND_REPO}/backend-swag:${BACKEND_TAG-latest}
    build:
      context: ./backend
    command: bash ./startup.sh
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      ENV_TYPE: ${ENV_TYPE-local}
      DB_USER: "${DB_USER?Var not set}"
      DB_PASSWORD: "${DB_PASSWORD?Var not set}"
      DB_HOST: "db"
      DB_PORT: "${DB_PORT?Var not set}"
      DB_NAME: "${DB_NAME?Var not set}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY?Var not set}"
      JWT_PUBLIC_KEY: "${JWT_PRIVATE_KEY?Var not set}"
      ADMIN_EMAIL: ${ADMIN_EMAIL?Var not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?Var not set}
    env_file:
      - .env
    networks:
      - app-network

  backend:
    image: ${BACKEND_REPO}/backend-swag:${BACKEND_TAG-latest}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_PORT?Var not set}:8000"
    environment:
      DB_USER: "${DB_USER?Var not set}"
      DB_PASSWORD: "${DB_PASSWORD?Var not set}"
      DB_HOST: "db"
      DB_PORT: "${DB_PORT?Var not set}"
      DB_NAME: "${DB_NAME?Var not set}"
      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY?Var not set}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY?Var not set}"
      ADMIN_EMAIL: ${ADMIN_EMAIL?Var not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD?Var not set}
    env_file:
      - .env
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
